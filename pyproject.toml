[project]
name = "aiccon-database-platform"
version = "0.1.0"
description = "Statistical data platform for social economy research (AICCON)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "pandas>=3.0.1",
    "requests>=2.33.0",
    "tenacity>=9.1.4",
    "pyarrow>=15.0.0",
    "gcsfs>=2026.5.0",
    "google-genai>=2.34.0",
    "google-cloud-storage>=3.10.1",
    "google-cloud-bigquery>=3.41.0",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "duckdb>=2.0.0",
    "hatchling>=1.29.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "processing", "database", "genai"]
