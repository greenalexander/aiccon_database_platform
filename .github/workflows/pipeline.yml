# .github/workflows/pipeline.yml
#
# Runs the aiccon-data pipeline (ingest -> process -> database) and then the
# integrity checks. Triggered monthly on a schedule, or manually from the
# Actions tab with a choice of stage and domain.

name: Monthly pipeline

on:
  schedule:
    # Minute, hour, day of month, month, day of week. Always UTC.
    # 06:17 UTC on the 1st = 07:17 in Italy in winter, 08:17 in summer.
    # Minute 17 rather than 0 because GitHub delays runs at the top of the hour.
    - cron: "17 6 1 * *"

  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to run"
        type: choice
        options: [all, ingest, process, database]
        default: all
      domain:
        description: "Domain to run"
        type: choice
        options: [all, social_economy, labour]
        default: all
      run_integrity_checks:
        description: "Run the integrity checks afterwards"
        type: boolean
        default: true
      write_digest:
        description: "Write this month's digest (overwrites it if it exists)"
        type: boolean
        default: false

# What the job's automatic GitHub token may do. id-token: write lets the job
# ask GitHub for the signed identity token that Workload Identity Federation
# exchanges for Google credentials. contents: read lets it check out the code.
permissions:
  contents: read
  id-token: write

# Never run two copies at once: a manual run started during the scheduled one
# waits for it to finish instead of writing to the same tables in parallel.
concurrency:
  group: aiccon-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      digest_written: ${{ steps.digest.outputs.written }}

    # Read by load_config() in base_loader.py, in place of config/.env.
    env:
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      BQ_PROJECT: ${{ vars.BQ_PROJECT }}
      BQ_DATASET: ${{ vars.BQ_DATASET }}
      PYTHONUNBUFFERED: "1"   # print log lines immediately, in order

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pipeline
        id: pipeline
        env:
          # Scheduled runs have no inputs, so fall back to 'all'.
          STAGE: ${{ inputs.stage || 'all' }}
          DOMAIN: ${{ inputs.domain || 'all' }}
        run: |
          args=()
          if [ "$STAGE" != "all" ]; then args+=(--stage "$STAGE"); fi
          if [ "$DOMAIN" != "all" ]; then args+=(--domain "$DOMAIN"); fi
          echo "Running: python run_pipeline.py ${args[*]}"
          python run_pipeline.py "${args[@]}"

      - name: Run integrity checks
        # Run even if the pipeline step failed, but not if the run was
        # cancelled or never reached the pipeline step (e.g. failed login).
        if: ${{ !cancelled() && steps.pipeline.outcome != 'skipped' && (github.event_name == 'schedule' || inputs.run_integrity_checks) }}
        env:
          DOMAIN: ${{ inputs.domain || 'all' }}
        run: |
          args=()
          if [ "$DOMAIN" != "all" ]; then args+=(--domain "$DOMAIN"); fi
          python -m database.tests.test_integrity "${args[@]}"

      - name: Write monthly digest
        id: digest
        # Same rule as the integrity checks: run even if earlier steps failed,
        # because stale or missing datasets are what the digest reports.
        if: ${{ !cancelled() && steps.pipeline.outcome != 'skipped' && (github.event_name == 'schedule' || inputs.write_digest) }}
        env:
          # Step-level, so only this step's process can see the key.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m genai.summarise --local-copy digest
          echo "written=true" >> "$GITHUB_OUTPUT"

      - name: Keep the digest for the publishing job
        if: ${{ !cancelled() && steps.digest.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: digest
          path: digest/
          retention-days: 7;

  publish-digest:
    # Publishes the digest as a GitHub release. A separate job so that only this
    # job can write to the repository, and it holds no Google credentials.
    needs: pipeline
    if: ${{ !cancelled() && needs.pipeline.outputs.digest_written == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the digest
        uses: actions/download-artifact@v8
        with:
          name: digest
          path: digest

      - name: Create or update this month's release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          file=$(ls digest/digest_*.md)
          month=$(basename "$file" .md); month=${month#digest_}
          tag="digest-$month"
          title=$(head -n 1 "$file" | sed 's/^# //')   # "Aggiornamento dati AICCON: novembre 2026"
          tail -n +3 "$file" > notes.md                  # the digest without its heading
          if gh release view "$tag" --repo "$REPO" > /dev/null 2>&1; then
            gh release edit "$tag" --repo "$REPO" --title "$title" --notes-file notes.md
            echo "Updated release $tag"
          else
            gh release create "$tag" --repo "$REPO" --title "$title" --notes-file notes.md --target "$GITHUB_SHA"
            echo "Created release $tag"
          fi